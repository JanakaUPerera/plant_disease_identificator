<text x="30" y="678" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">The first block of stages 2–4 uses stride 2, halving height and width; the skip connection lets the signal and its gradient bypass the convolutions, so deep networks still train.</text>
